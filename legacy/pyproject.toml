[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","httpx>=0.27,<1","requests>=2.32,<3","SQLAlchemy>=2.0,<2.1","psycopg[binary]>=3.2,<4","opentelemetry-sdk>=1.30,<2","opentelemetry-exporter-otlp-proto-http>=1.30,<2","opentelemetry-instrumentation-fastapi","opentelemetry-instrumentation-httpx","opentelemetry-instrumentation-requests","opentelemetry-instrumentation-sqlalchemy"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "flexmock>=0.12,<1"]

[project.scripts]
legacy = "service_legacy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["service_legacy"]

[tool.coverage.report]
show_missing = true
