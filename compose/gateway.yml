---
services:
  gateway:
    image: envoyproxy/envoy:v1.36.11
    ports:
    - "${GATEWAY_WEB_PORT}:8080"
    environment:
    - CANDIDATE_URL=${GATEWAY__CANDIDATE_URL}
    - LEGACY_URL=${GATEWAY__LEGACY_URL}
    - TELEMETRY_URL=${GATEWAY__TELEMETRY_URL}
    volumes:
    - "./gateway/envoy.yaml:/etc/envoy/envoy.yaml"
    depends_on:
      telemetry:
        condition: service_started
        restart: true
      legacy:
        condition: service_started
      candidate:
        condition: service_started
    command:
    - "-c /etc/envoy/envoy.yaml"
    labels:
      app.kubernetes.io/managed-by: mobilis
      mobilis.io/project: http-migration
      mobilis.io/service: gateway
